openapi: 3.0.3
info:
  title: SDD testbed — сервис аутентификации
  version: 1.0.0
  description: Сгенерировано из manifest.yaml (sdd-testbed). Не править руками.
servers:
- url: http://localhost:8083
paths:
  /api/v1/auth/login:
    post:
      operationId: login
      tags:
      - AuthController
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
  /api/v1/auth/register:
    post:
      operationId: register
      tags:
      - AuthController
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /api/v1/auth/refresh:
    post:
      operationId: refresh
      tags:
      - AuthController
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
  /api/v1/auth/password/reset:
    post:
      operationId: resetPassword
      tags:
      - AuthController
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '204':
          description: No Content
  /api/v1/auth/mfa/verify:
    post:
      operationId: verifyMfa
      tags:
      - AuthController
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerifyRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags:
      - AuthController
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
      - name: Cookie
        in: header
        required: false
        schema:
          type: string
      responses:
        '204':
          description: No Content
  /oauth2/authorize:
    get:
      operationId: authorize
      tags:
      - OAuthController
      parameters:
      - name: response_type
        in: query
        required: false
        schema:
          type: string
      - name: client_id
        in: query
        required: false
        schema:
          type: string
      - name: redirect_uri
        in: query
        required: false
        schema:
          type: string
      - name: state
        in: query
        required: false
        schema:
          type: string
      - name: code_challenge
        in: query
        required: false
        schema:
          type: string
      - name: nonce
        in: query
        required: false
        schema:
          type: string
      responses:
        '204':
          description: No Content
  /oauth2/token:
    post:
      operationId: token
      tags:
      - OAuthController
      parameters:
      - name: grant_type
        in: query
        required: false
        schema:
          type: string
      - name: code
        in: query
        required: false
        schema:
          type: string
      - name: redirect_uri
        in: query
        required: false
        schema:
          type: string
      - name: client_id
        in: query
        required: false
        schema:
          type: string
      - name: client_secret
        in: query
        required: false
        schema:
          type: string
      - name: code_verifier
        in: query
        required: false
        schema:
          type: string
      - name: refresh_token
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
  /admin/users:
    get:
      operationId: listUsers
      tags:
      - UserAdminController
      parameters:
      - name: email
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
  /admin/users/{userId}:
    get:
      operationId: getUser
      tags:
      - UserAdminController
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /admin/users/{userId}/impersonate:
    post:
      operationId: impersonate
      tags:
      - UserAdminController
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
  /admin/users/{userId}/sessions:
    delete:
      operationId: dropSessions
      tags:
      - UserAdminController
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: No Content
  /api/v1/roles:
    get:
      operationId: listRoles
      tags:
      - RoleController
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoleDto'
  /api/v1/api-keys:
    post:
      operationId: createApiKey
      tags:
      - ApiKeyController
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiKeyCreateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyDto'
    get:
      operationId: listApiKeys
      tags:
      - ApiKeyController
      parameters:
      - name: X-Api-Key
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiKeyDto'
  /api/v1/me/sessions:
    get:
      operationId: listMySessions
      tags:
      - MySessionsController
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionDto'
  /config/keycloak.json:
    get:
      operationId: keycloakConfig
      tags:
      - ConfigController
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /config/ui-theme.json:
    get:
      operationId: uiTheme
      tags:
      - ConfigController
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /actuator/env:
    get:
      operationId: env
      tags:
      - OpsController
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/v1/nlp/tokenize:
    post:
      operationId: tokenize
      tags:
      - TokenizerController
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenizeRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenizeResponse'
components:
  schemas:
    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
        otp:
          type: string
        captchaToken:
          type: string
        rememberMe:
          type: boolean
    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        idToken:
          type: string
        tokenType:
          type: string
        expiresIn:
          type: integer
          format: int64
        scope:
          type: string
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
        passwordConfirm:
          type: string
        phone:
          type: string
        inviteCode:
          type: string
        acceptTerms:
          type: boolean
    PasswordResetRequest:
      type: object
      properties:
        resetToken:
          type: string
        newPassword:
          type: string
    MfaVerifyRequest:
      type: object
      properties:
        mfaCode:
          type: string
        deviceId:
          type: string
        trustDevice:
          type: boolean
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        email:
          type: string
        displayName:
          type: string
        roles:
          type: array
          items:
            type: string
        passwordHash:
          type: string
        mfaSecret:
          type: string
        lastLoginIp:
          type: string
        lastLoginAt:
          type: string
          format: date-time
        locked:
          type: boolean
    ApiKeyDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        apiKey:
          type: string
        prefix:
          type: string
        createdBy:
          type: string
        expiresAt:
          type: string
          format: date-time
    ApiKeyCreateRequest:
      type: object
      properties:
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
    RoleDto:
      type: object
      properties:
        name:
          type: string
        permissions:
          type: array
          items:
            type: string
    SessionDto:
      type: object
      properties:
        sessionId:
          type: string
        userAgent:
          type: string
        ip:
          type: string
        location:
          type: string
        createdAt:
          type: string
          format: date-time
    TokenizeRequest:
      type: object
      properties:
        text:
          type: string
        tokenizer:
          type: string
        maxTokens:
          type: integer
          format: int32
    TokenizeResponse:
      type: object
      properties:
        tokens:
          type: array
          items:
            type: string
        tokenCount:
          type: integer
          format: int32
