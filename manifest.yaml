    items:
      - [JWT_SIGNING_SECRET, "c2VjcmV0LWtleS1mb3ItdGVzdGJlZC1vbmx5LTAwMDE=", AUTH hard, "секрет подписи JWT; в значении нет слова secret — видно только по имени константы"]
