# ============================================================
# identity — сервис аутентификации. Фокус: AUTH (пароли, токены, ключи,
# OAuth, заголовки), секреты в коде, admin-зона, Spring Security в импортах.
# Уязвимости: хэш пароля и MFA-секрет в ответе админки, ключи API в
# открытом виде, захардкоженные секреты.
# ============================================================
app: identity
title: "SDD testbed — сервис аутентификации"
package: ru.testbed.identity
port: 8083
dependencies:
  - org.springframework.security:spring-security-core
  - io.jsonwebtoken:jjwt-api:0.12.6

dtos:
  LoginRequest:
    - [username, String, PII_INDIRECT accept=AUTH]
    - [password, String, AUTH]
    - [otp, String, AUTH]
    - [captchaToken, String, GRAY, "токен капчи: короткоживущий, спорно"]
    - [rememberMe, Boolean]

  TokenResponse:
    - [accessToken, String, AUTH]
    - [refreshToken, String, AUTH]
    - [idToken, String, AUTH]
    - [tokenType, String, NONE trap, "Bearer — тип, а не токен"]
    - [expiresIn, Long]
    - [scope, String]

  RegisterRequest:
    - [email, String, PII_DIRECT]
    - [password, String, AUTH]
    - [passwordConfirm, String, AUTH hard, "password_confirm"]
    - [phone, String, PII_DIRECT]
    - [inviteCode, String, GRAY]
    - [acceptTerms, Boolean]

  PasswordResetRequest:
    - [resetToken, String, AUTH]
    - [newPassword, String, AUTH hard, "new_password — правило ждёт ровно password"]

  MfaVerifyRequest:
    - [mfaCode, String, AUTH]
    - [deviceId, String, PII_INDIRECT]
    - [trustDevice, Boolean]

  # Имя класса User в пакете model — для ctx.import.pii_model
  User:
    package: model
    fields:
      - [id, Long]
      - [username, String, PII_INDIRECT accept=AUTH]
      - [email, String, PII_DIRECT]
      - [displayName, String, PII_DIRECT]
      - [roles, List<String>]
      - [passwordHash, String, AUTH hard, "хэш пароля в ответе — уязвимость; password_hash не совпадает с шаблоном"]
      - [mfaSecret, String, AUTH hard, "TOTP-секрет"]
      - [lastLoginIp, String, PII_INDIRECT hard, "last_login_ip"]
      - [lastLoginAt, Instant]
      - [locked, Boolean]

  ApiKeyDto:
    - [id, Long]
    - [name, String]
    - [apiKey, String, AUTH]
    - [prefix, String]
    - [createdBy, String, PII_INDIRECT]
    - [expiresAt, Instant]

  ApiKeyCreateRequest:
    - [name, String]
    - [scopes, List<String>]

  RoleDto:
    - [name, String]
    - [permissions, List<String>]

  SessionDto:
    - [sessionId, String, AUTH accept=PII_INDIRECT, "идентификатор сессии = учётные данные"]
    - [userAgent, String, PII_INDIRECT]
    - [ip, String, PII_INDIRECT]
    - [location, String, PII_INDIRECT]
    - [createdAt, Instant]

  TokenizeRequest:
    - [text, String, DYNAMIC, "произвольный текст на токенизацию"]
    - [tokenizer, String, NONE trap, "название токенизатора"]
    - [maxTokens, Integer, NONE trap]

  TokenizeResponse:
    - [tokens, List<String>, GRAY, "токены текста: повторяют входной текст"]
    - [tokenCount, Integer, NONE trap]

controllers:
  - class: AuthController
    base: /api/v1/auth
    extra_imports:
      - org.springframework.security.core.context.SecurityContextHolder
    endpoints:
      - op: login
        http: POST
        path: /login
        body: [credentials, LoginRequest]
        returns: TokenResponse
        expect: [AUTH]
      - op: register
        http: POST
        path: /register
        body: [request, RegisterRequest]
        returns: User
        expect: [AUTH, PII_DIRECT]
      - op: refresh
        http: POST
        path: /refresh
        params: [[Authorization, header, String, AUTH]]
        returns: TokenResponse
        expect: [AUTH]
      - op: resetPassword
        http: POST
        path: /password/reset
        body: [request, PasswordResetRequest]
        expect: [AUTH]
      - op: verifyMfa
        http: POST
        path: /mfa/verify
        body: [request, MfaVerifyRequest]
        returns: TokenResponse
        expect: [AUTH]
      - op: logout
        http: POST
        path: /logout
        params:
          - [Authorization, header, String, AUTH]
          - [Cookie, header, String, AUTH]
        code: ["SecurityContextHolder.clearContext();"]
        expect: [AUTH]

  - class: OAuthController
    base: /oauth2
    endpoints:
      - op: authorize
        http: GET
        path: /authorize
        params:
          - [response_type, query, String]
          - [client_id, query, String, GRAY]
          - [redirect_uri, query, String, GRAY, "не секрет, но правило OAuth его ловит"]
          - [state, query, String, GRAY]
          - [code_challenge, query, String, AUTH]
          - [nonce, query, String, AUTH]
        expect: [AUTH]
      - op: token
        http: POST
        path: /token
        params:
          - [grant_type, query, String, GRAY, "тип гранта: не секрет"]
          - [code, query, String, AUTH hard, "authorization code; имя code само ничего не говорит"]
          - [redirect_uri, query, String, GRAY]
          - [client_id, query, String, GRAY]
          - [client_secret, query, String, AUTH]
          - [code_verifier, query, String, AUTH]
          - [refresh_token, query, String, AUTH]
        returns: TokenResponse
        expect: [AUTH]

  - class: UserAdminController
    base: /admin/users
    extra_imports:
      - org.springframework.security.core.Authentication
    endpoints:
      - op: listUsers
        http: GET
        params:
          - [email, query, String, PII_DIRECT]
          - [page, query, Integer]
        returns: List<User>
        expect: [AUTH, PII_DIRECT]
        admin: true
      - op: getUser
        http: GET
        path: /{userId}
        params: [[userId, path, Long, PII_INDIRECT]]
        returns: User
        expect: [AUTH, PII_DIRECT]
        admin: true
      - op: impersonate
        http: POST
        path: /{userId}/impersonate
        params: [[userId, path, Long, PII_INDIRECT]]
        returns: TokenResponse
        expect: [AUTH]
        allow: [PII_DIRECT]
        admin: true
      - op: dropSessions
        http: DELETE
        path: /{userId}/sessions
        params: [[userId, path, Long, PII_INDIRECT]]
        expect: [AUTH]
        allow: [PII_DIRECT]
        admin: true

  - class: RoleController
    base: /api/v1/roles
    endpoints:
      - op: listRoles
        http: GET
        returns: List<RoleDto>
        expect: [AUTH]

  - class: ApiKeyController
    base: /api/v1/api-keys
    doc: "Выдача API-ключей. Путь api-keys правила не знают."
    endpoints:
      - op: createApiKey
        http: POST
        body: [request, ApiKeyCreateRequest]
        returns: ApiKeyDto
        expect: [AUTH]
      - op: listApiKeys
        http: GET
        params: [[X-Api-Key, header, String, AUTH]]
        returns: List<ApiKeyDto>
        expect: [AUTH]

  - class: MySessionsController
    base: /api/v1/me/sessions
    endpoints:
      - op: listMySessions
        http: GET
        returns: List<SessionDto>
        expect: [AUTH, PII_INDIRECT]

  - class: ConfigController
    base: /config
    endpoints:
      - op: keycloakConfig
        http: GET
        path: /keycloak.json
        returns: "Map<String, Object>"
        returns_label: ["AUTH", "конфиг Keycloak: realm, client secret"]
        expect: [AUTH]
      - op: uiTheme
        http: GET
        path: /ui-theme.json
        returns: "Map<String, Object>"
        returns_label: ["NONE trap", "цвета и шрифты интерфейса"]
        expect: []
        why: "ловушка: .json в пути — не значит секреты"

  - class: OpsController
    base: /actuator
    endpoints:
      - op: env
        http: GET
        path: /env
        returns: "Map<String, Object>"
        returns_label: ["AUTH hard", "переменные окружения с паролями"]
        expect: [AUTH]
        admin: true

  - class: TokenizerController
    base: /api/v1/nlp
    doc: "Ловушка: токенизация текста (NLP), а не токены доступа."
    endpoints:
      - op: tokenize
        http: POST
        path: /tokenize
        body: [request, TokenizeRequest]
        returns: TokenizeResponse
        expect: []
        allow: [DYNAMIC]

